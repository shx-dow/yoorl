services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - YOORL_BASE_URL=http://localhost:8080
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
